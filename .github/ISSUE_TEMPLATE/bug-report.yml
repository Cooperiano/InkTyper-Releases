name: Bug report
description: Report an InkTyper release, installation, or runtime problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve InkTyper. Do not include tokens, private transcripts, or personal data.
  - type: input
    id: version
    attributes:
      label: InkTyper version
      placeholder: 2.0.17
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and desktop
      placeholder: Ubuntu 24.04, GNOME, Wayland
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Installation format
      options:
        - Debian package (.deb)
        - AppImage
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence that consistently reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
